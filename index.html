<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF=8">
  <title>Le Commencement</title>

<style>
  body {
    background: linear-gradient(
      125deg,
      #020b18 0%,
      #0d1a45 20%,
      #0a0f1d 50%,
      #0d1a45 80%,
      #020b18 100%
      );
     color: #a6adc8;
    font-family: Arial;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
  }
  h1{
      color: #2c5551;
      font-size: 2.5rem;
      margin-bottom: 10xp;
      transition: transform 1 ease, color 0.7 ease;
  }
  h1:hover {
    transform: scale(1.05);
      color: #60a5fa;
  }
  p{
      font-size: 20px;
      color: #a6adc8;
      margin-bottom: 30px;
  }
  .btn-container {
    display: flex;
    gap: 15xp;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn{
    padding: 12px 24px;
    font-size:16px;
    font-weight: bold;
    color: #ffffff; 
    background-color: #1e40af;
    border: 2px solid #3b82f6;
    cursor: pointer;
    text-decoration:none;
    transition: all 1 ease;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
  }
  .btn:hover {
    background-color: #3b82f6;
    border-color: #60a5af;
    transform: transformlateY(-3px);
    box-shadow: 0xp 8xp 15xp rgba(60, 130, 250, 0.4);
  }
</style>
</head>
<body>

  <h1>bienvenue sur mon premier site web!</h1>
  <p>j'entre dans l'informatique.</p>
<div class="btn-container">
  <a href="https://github.com" target="_blank" class="btn">bienvenue</a>
  <botton class="btn btn-secondary" onclick="alert('comment cv?')">question</botton>
</div> 
</body>
</html>
